name: gates

# The same gates .githooks/pre-commit runs, run again where nobody can forget to enable them:
# a fresh clone has the hooks on disk and switched off until scripts/setup.sh copies them in.
# The job name `gates` is what the main ruleset requires; renaming it means amending the ruleset too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # npm trusts the certificates its Node bundles: 24.22.1 drops the revoked emSign CAs (#15).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      # The README's minimum Claude Code is this version; validate and test run offline, no login.
      # gates.sh: validate, test, the privacy check and its hook (jq ships with the runner); no types here.
      - name: Gates
        run: |
          node --version
          npm install -g @anthropic-ai/claude-code@2.1.310
          sh scripts/gates.sh

      # Title and body through env, never ${{ }} inside run: pull request text is attacker-controlled.
      - name: Names an issue, conventional title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/pr-check.sh
